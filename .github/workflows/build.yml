name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Allow the tag builds to attach binaries to the GitHub Release.
permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-linux,   ext: "" }
          - { os: macos-latest,   target: aarch64-macos,  ext: "" }
          - { os: windows-latest, target: x86_64-windows, ext: ".exe" }

    steps:
      - uses: actions/checkout@v4

      # winit/softbuffer pull in X11 + Wayland tooling on Linux; macOS and
      # Windows need nothing beyond the toolchain.
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release --locked

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist-bin
          cp "target/release/wlmatrix${{ matrix.ext }}" \
             "dist-bin/wlmatrix-${{ matrix.target }}${{ matrix.ext }}"

      # macOS: also assemble a double-clickable wlmatrix.app (icon + Info.plist)
      # and zip it with ditto (preserves the bundle layout + exec bits).
      - name: Build .app bundle (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          VERSION="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          bash dist/macos/make-app.sh target/release/wlmatrix "$VERSION" dist-bin
          ( cd dist-bin && ditto -c -k --keepParent wlmatrix.app wlmatrix-macos.app.zip && rm -rf wlmatrix.app )

      - uses: actions/upload-artifact@v4
        with:
          name: wlmatrix-${{ matrix.target }}
          path: dist-bin/*

      # On a version tag, attach each platform's binary to the release.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-bin/*
