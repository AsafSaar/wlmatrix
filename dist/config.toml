# wlmatrix configuration  —  ~/.config/wlmatrix/config.toml
# Flat "key = value" (a subset of TOML). CLI flags override anything here.

# Idle time before the screensaver starts, in milliseconds (read by the
# wl-screensaver daemon). 300000 = 5 minutes, 60000 = 1 minute.
idle_ms = 300000

# Visual style preset:
#   classic = ASCII rain (default)
#   neo     = the modern look: additive bloom + half-width katakana
# style = "neo"

# Additive bloom/glow on bright pixels (set by `style = neo`; override here).
glow = false

# Parallax depth: number of rain layers (1 = flat, 2-3 = volumetric).
# Far layers are smaller, slower and dimmer than near ones.
depth = 1

# "Operator view": hide an image or text in the rain. A PNG's luminance (or the
# shape of the text) becomes a faint ghost under the rain that brightens as the
# heads fall through it — it reads in motion, not as a still.
#   mask      = a PNG path (any size/format; brightness = luminance × alpha)
#   mask_text = a line of text (used only if `mask` is unset)
# mask = "/path/to/picture.png"
# mask_text = "WAKE UP"

# How strongly the hidden image glows, 0..1. Lower it (~0.5) for a subtler
# ghost on plain rain; the default reads against the heavier "neo" look too.
mask_intensity = 0.85

# Negative-space contrast, 0..1 (default 0 = off). When > 0, the rain OUTSIDE
# the figure is dimmed so the silhouette reads as true figure-ground — the
# classic "operator view". Try ~0.4–0.6 for a dramatic hidden image.
mask_contrast = 0.0

# Animation frame rate.
fps = 30

# Glyph size in pixels (bigger = larger characters and sparser rain).
font_size = 26

# Fall-speed range, in rows per second.
speed_min = 6
speed_max = 24

# Color theme: green | amber | cyan | red | purple | white | "#RRGGBB"
color = "green"

# Characters that rain:
#   preset:  ascii | alnum | binary | digits | katakana
#            (katakana needs a CJK-capable font — see `font` below)
#   literal: any string, e.g. "01" or "アイウエオカキ"
charset = "ascii"

# Optional: force a specific font file. If unset, a system monospace is found.
# font = "/usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf"
